services:
  nginx:
    image: nginx:1.30.4-trixie
    restart: always
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      HTTPS_PORT: "${HTTPS_PORT:-443}"
    command:
      - /bin/sh
      - -c
      - envsubst '$${HTTPS_PORT}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      edge:
        aliases:
          - auth.localhost

  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    networks:
      - car-data
      - ai-data

  keycloak-postgres:
    image: postgres:18.6-trixie
    restart: always
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    networks:
      - auth-data

volumes:
  postgres-data:
  keycloak-postgres-data:

networks:
  edge:
  auth-data:
    internal: true
  car-data:
    internal: true
  ai-data:
    internal: true
