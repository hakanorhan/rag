name: rag-prod

include:
  - compose.infrastructure.yml
  - rag-app/compose.yml
  - backend/carservice/compose.yaml
  - backend/aiservice/compose.yaml

services:
  keycloak:
    extends:
      file: compose.keycloak.yml
      service: keycloak
    command: start
    environment:
      KC_HTTP_ENABLED: "true"
