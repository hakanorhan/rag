worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
}


http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app_backend {
    zone app_backend 64k;
    server app:3000 resolve;
  }

  upstream keycloak_backend {
    zone keycloak_backend 64k;
    server keycloak:8090 resolve;
  }

  upstream carservice_backend {
    zone carservice_backend 64k;
    server carservice:8080 resolve;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://carservice_backend;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  include /etc/nginx/conf.d/*.conf;
}
