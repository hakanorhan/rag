name: rag-prod

include:
  - compose.infrastructure.yml
  - rag-app/compose.prod.yml
  - backend/carservice/compose.prod.yml
  - backend/aiservice/compose.prod.yml

services:
  keycloak:
    extends:
      file: compose.keycloak.yml
      service: keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      BASE_URL: ${BASE_URL}
      CLIENT_SECRET: ${CLIENT_SECRET}
    volumes:
      - ./infrastructure/keycloak/prod:/opt/keycloak/data/import:ro
