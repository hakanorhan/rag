services:
  aiservice:
    image: rag-aiservice:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - aiservice-maven-cache:/root/.m2
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPRING_DATASOURCE_URL: jdbc:postgresql://pgvector:5432/${AI_POSTGRES_DB:-aiservice}
      SPRING_DATASOURCE_USERNAME: ${AI_POSTGRES_USER:-aiservice}
      SPRING_DATASOURCE_PASSWORD: ${AI_POSTGRES_PASSWORD:-aiservice}
      CARSERVICE_BASE_URL: http://carservice:8080
      ISSUER: ${ISSUER}
      KEYCLOAK_INTERNAL_REALM_URI: ${KEYCLOAK_INTERNAL_REALM_URI:-http://keycloak:8090/realms/rag}

    env_file:
      - ../.env.secret

    expose:
      - "8081"
    depends_on:
      pgvector:
        condition: service_healthy
      carservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45m
    networks:
      - edge
      - ai-data
    develop:
      watch:
        - action: sync+exec
          path: ./src
          target: /app/src
          initial_sync: true
          exec:
            command: mvn --batch-mode --no-transfer-progress -DskipTests compile
        - action: rebuild
          path: ./pom.xml
        - action: rebuild
          path: ./Dockerfile.dev

  pgvector:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ${AI_POSTGRES_DB:-aiservice}
      POSTGRES_USER: ${AI_POSTGRES_USER:-aiservice}
      POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:-aiservice}
    expose:
      - "5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m
    networks:
      - ai-data

volumes:
  aiservice-maven-cache:
  pgvector-data:
