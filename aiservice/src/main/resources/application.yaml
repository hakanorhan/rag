server:
  port: 8081

spring:
  config:
    import: classpath:commonlib.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${AI_SERVICE_CLIENT_ID:aiservice}
  application:
    name: aiservice

  ai:
    model:
      chat: openai
      embedding: ollama

    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        extra-body:
          include_reasoning: false

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
      init:
        pull-model-strategy: when_missing
        timeout: 30m
      chat:
        model: gemma4:26b
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiservice}
    username: ${SPRING_DATASOURCE_USERNAME:aiservice}
    password: ${SPRING_DATASOURCE_PASSWORD:aiservice}
  http:
    serviceclient:
      carservice:
        base-url: ${CARSERVICE_BASE_URL:http://localhost:8080}
