server:
  port: 8081

spring:
  application:
    name: aiservice

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
      init:
        pull-model-strategy: when_missing
        timeout: 30m
      chat:
        model: llama3.2:3b
        num-ctx: 4096
      embedding:
        model: mxbai-embed-large
    vectorstore:
      pgvector:
        initialize-schema: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiservice}
    username: ${SPRING_DATASOURCE_USERNAME:aiservice}
    password: ${SPRING_DATASOURCE_PASSWORD:aiservice}
