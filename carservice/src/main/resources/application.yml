server:
  port: 8080
spring:
  config:
    import: classpath:commonlib.yml
  application:
    name: carservice
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${CAR_SERVICE_CLIENT_ID:carservice}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
