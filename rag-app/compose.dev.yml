services:
  app:
    extends:
      file: compose.base.yml
      service: app
    image: rag-app:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - .:/app
      - rag-app-node-modules:/app/node_modules
      - rag-app-next-cache:/app/.next

volumes:
  rag-app-node-modules:
  rag-app-next-cache:
