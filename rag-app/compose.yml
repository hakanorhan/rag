services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.${APP_ENV}
    volumes:
      - .:/app
      - rag-app-node-modules:/app/node_modules
      - rag-app-next-cache:/app/.next
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "auth.localhost:host-gateway"
    environment:
      BASE_URL: ${BASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      ISSUER: ${ISSUER}

volumes:
  rag-app-node-modules:
  rag-app-next-cache:
