services:
  app:
    image: rag-app:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        BASE_URL: ${BASE_URL}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        CLIENT_ID: ${CLIENT_ID}
        ISSUER: ${ISSUER}
      secrets:
        - better_auth_secret
        - client_secret
    volumes:
      - rag-app-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m
    environment:
      AI_API_URL: ${AI_API_URL:-http://aiservice:8081/api/ai}
      CAR_API_URL: ${CAR_API_URL:-http://carservice:8080}
      BASE_URL: ${BASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      ISSUER: ${ISSUER}
      KEYCLOAK_INTERNAL_REALM_URI: ${KEYCLOAK_INTERNAL_REALM_URI:-http://keycloak:8090/realms/rag}
    networks:
      - edge

volumes:
  rag-app-data:

secrets:
  better_auth_secret:
    environment: BETTER_AUTH_SECRET
  client_secret:
    environment: CLIENT_SECRET
