name: Spring Boot AI CI

on:
  push:
    branches: [main]
    paths:
      - 'aiservice/**'
      - '.github/workflows/aiservice.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aiservice/**'
      - '.github/workflows/aiservice.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: aiservice

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: aiservice/pom.xml

      - name: Build and test with Maven
        run: ./mvnw -B verify
