name: Spring Boot AI CI

on:
  push:
    branches: [main]
    paths:
      - 'application/backend/aiservice/**'
      - 'application/backend/commonlib/**'
      - 'application/backend/service-parent/**'
      - 'application/backend/pom.xml'
      - '.github/workflows/aiservice.yml'
  pull_request:
    branches: [main]
    paths:
      - 'application/backend/aiservice/**'
      - 'application/backend/commonlib/**'
      - 'application/backend/service-parent/**'
      - 'application/backend/pom.xml'
      - '.github/workflows/aiservice.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: application/backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            application/backend/pom.xml
            application/backend/*/pom.xml

      - name: Build and test with Maven
        run: ./aiservice/mvnw -B -pl aiservice -am verify -Dtest='!RagEvaluatorTest,!AiserviceApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
