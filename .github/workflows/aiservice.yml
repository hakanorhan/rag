name: Spring Boot AI CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: aiservice

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: aiservice/pom.xml

      - name: Build and test with Maven
        run: ./mvnw -B verify
