name: Spring Boot CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/carservice/**'
      - 'backend/commonlib/**'
      - 'backend/service-parent/**'
      - 'backend/pom.xml'
      - '.github/workflows/maven.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/carservice/**'
      - 'backend/commonlib/**'
      - 'backend/service-parent/**'
      - 'backend/pom.xml'
      - '.github/workflows/maven.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/*/pom.xml

      - name: Build and test with Maven
        run: ./carservice/mvnw -B -pl carservice -am verify
