name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: e2e/package-lock.json

    - name: Install E2E dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Create test TLS certificate
      run: |
        mkdir -p infrastructure/nginx/certs
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout infrastructure/nginx/certs/local.key \
          -out infrastructure/nginx/certs/local.crt \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,DNS:auth.localhost"
      working-directory: .
    - name: Start Playwright application stack
      run: >-
        docker compose --env-file ../.env.dev -f ../compose.dev.yml
        up --build --wait --wait-timeout 600 --no-deps
        postgres kafka keycloak-postgres keycloak carservice app nginx
    - name: Run Playwright tests
      run: npx playwright test --reporter=list
