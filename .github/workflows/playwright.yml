name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          e2e/package-lock.json
          rag-app/package-lock.json

    - name: Install E2E dependencies
      run: npm ci
    - name: Install application dependencies
      run: npm ci
      working-directory: rag-app
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Lint frontend
      run: npm run lint
      working-directory: rag-app
    - name: Validate Compose configuration
      run: docker compose --env-file .env.ci -f compose.yml config --quiet
      working-directory: .
    - name: Pull Keycloak image
      run: |
        for attempt in 1 2 3; do
          docker compose --env-file .env.ci -f compose.yml pull keycloak && exit 0
          if [ "$attempt" -eq 3 ]; then exit 1; fi
          sleep 15
        done
      working-directory: .
    - name: Start application, Keycloak and Car Service
      run: docker compose --env-file .env.ci -f compose.yml up --build --wait --wait-timeout 600 nginx carservice
      working-directory: .
    - name: Run Playwright tests
      run: npx playwright test
    - name: Show container logs
      if: failure()
      run: docker compose --env-file .env.ci -f compose.yml logs --no-color
      working-directory: .
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e/playwright-report/
        if-no-files-found: ignore
        retention-days: 30
    - name: Stop application stack
      if: always()
      run: docker compose --env-file .env.ci -f compose.yml down --volumes --remove-orphans
      working-directory: .
