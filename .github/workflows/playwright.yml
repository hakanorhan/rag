name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          e2e/package-lock.json
          application/rag-app/package-lock.json
    - uses: hashicorp/setup-terraform@v4

    - name: Install E2E dependencies
      run: npm ci
    - name: Install application dependencies
      run: npm ci
      working-directory: application/rag-app
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Lint frontend
      run: npm run lint
      working-directory: application/rag-app
    - name: Create test TLS certificate
      run: |
        mkdir -p infrastructure/nginx/certs
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout infrastructure/nginx/certs/local.key \
          -out infrastructure/nginx/certs/local.crt \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,DNS:auth.localhost"
      working-directory: .
    - name: Start Floci
      run: docker compose -f floci.compose.dev.yml up -d
      working-directory: deployment/compose/compose-dev
    - name: Provision development S3 bucket
      run: terraform init && terraform apply -auto-approve
      working-directory: infrastructure/aws
    - name: Validate Compose configuration
      run: docker compose -f compose.dev.yml config --quiet
      working-directory: deployment/compose/compose-dev
    - name: Pull Keycloak image
      run: |
        for attempt in 1 2 3; do
          docker compose -f compose.dev.yml pull keycloak && exit 0
          if [ "$attempt" -eq 3 ]; then exit 1; fi
          sleep 15
        done
      working-directory: deployment/compose/compose-dev
    - name: Start Playwright application stack
      run: docker compose -f compose.dev.yml up --build --wait --wait-timeout 600 postgres nginx carservice
      working-directory: deployment/compose/compose-dev
    - name: Run Playwright tests
      run: npx playwright test --reporter=list
    - name: Show container logs
      if: failure()
      run: docker compose -f compose.dev.yml logs --no-color
      working-directory: deployment/compose/compose-dev
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e/playwright-report/
        if-no-files-found: ignore
        retention-days: 30
    - name: Stop application stack
      if: always()
      run: |
        docker compose -f compose.dev.yml down --volumes --remove-orphans
        docker compose -f floci.compose.dev.yml down --volumes --remove-orphans
      working-directory: deployment/compose/compose-dev
