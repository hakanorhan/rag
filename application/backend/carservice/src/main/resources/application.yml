server:
  port: 8080
paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  sandbox: ${PAYPAL_SANDBOX:true}
spring:
  config:
    import: classpath:commonlib.yml
  application:
    name: carservice
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: reservedConfirmation:com.example.commonlib.kafka.ReservedConfirmation,paidConfirmation:com.example.commonlib.kafka.PaidConfirmation
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${CAR_SERVICE_CLIENT_ID:carservice}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
