server:
  port: 8081

spring:
  config:
    import: classpath:commonlib.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: ${AI_SERVICE_CLIENT_ID:aiservice}
  application:
    name: aiservice
  cache:
    cache-names: freeTextSearches,freeTextSearchesById
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=600s

  ai:
    model:
      chat: none
      embedding: ollama

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://host.docker.internal:11434}
      init:
        pull-model-strategy: when_missing
        timeout: 30m
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aiservice}
    username: ${SPRING_DATASOURCE_USERNAME:aiservice}
    password: ${SPRING_DATASOURCE_PASSWORD:aiservice}
  http:
    serviceclient:
      carservice:
        base-url: ${CARSERVICE_BASE_URL:http://localhost:8080}

app:
  ai:
    provider: ${APP_AI_PROVIDER:OPENAI}
    base-url: ${APP_AI_BASE_URL:}
    model: ${APP_AI_MODEL:}
    api-key: ${APP_AI_API_KEY:}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://host.docker.internal:4566}
      region: ${AWS_REGION:eu-central-1}
      bucket: ${S3_BUCKET:?Set S3_BUCKET}
