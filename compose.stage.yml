name: rag-stage

services:
  nginx:
    image: nginx:1.30.4-trixie
    restart: always
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
      - "${AUTH_HTTPS_PORT:-8444}:${AUTH_HTTPS_PORT:-8444}"
    environment:
      HTTPS_PORT: "${HTTPS_PORT:-443}"
      AUTH_HTTPS_PORT: "${AUTH_HTTPS_PORT:-8444}"
      APP_HOST: "${APP_HOST:-localhost}"
      AUTH_HOST: "${AUTH_HOST:-localhost}"
      TLS_CERTIFICATE: "${TLS_CERTIFICATE:-/etc/nginx/certs/local.crt}"
      TLS_CERTIFICATE_KEY: "${TLS_CERTIFICATE_KEY:-/etc/nginx/certs/local.key}"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - edge

  app:
    image: rag-app:stage
    restart: always
    build:
      context: ./application/rag-app
      dockerfile: Dockerfile.stage
      target: production
      args:
        BASE_URL: ${BASE_URL}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        CLIENT_ID: ${CLIENT_ID}
        ISSUER: ${ISSUER}
        CAR_API_URL: http://host.docker.internal:18080
      secrets:
        - better_auth_secret
        - client_secret
        - altcha_hmac_secret
    expose:
      - "3000"
    environment:
      AI_API_URL: ${AI_API_URL:-http://aiservice:8081/api/ai}
      CAR_API_URL: ${CAR_API_URL:-http://carservice:8080}
      BASE_URL: ${BASE_URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      CHAT_SESSION_SECRET: ${CHAT_SESSION_SECRET}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      ISSUER: ${ISSUER}
      KEYCLOAK_INTERNAL_REALM_URI: ${KEYCLOAK_INTERNAL_REALM_URI:-http://keycloak:8090/realms/rag}
      SMTP_HOST: ${SMTP_HOST:-maildev}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@rag.local}
      CONTACT_TO: ${CONTACT_TO:-info@platzhalter.invalid}
      ALTCHA_HMAC_SECRET: ${ALTCHA_HMAC_SECRET}
      DATABASE_PATH: /app/data/sqlite.db
    volumes:
      - rag-app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m
    depends_on:
      carservice:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      aiservice:
        condition: service_healthy
    networks:
      - edge

  postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    networks:
      - car-data
      - ai-data
      - notification-data

  kafka:
    image: apache/kafka:4.3.1
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - edge

  carservice:
    image: rag-carservice:stage
    restart: always
    build:
      context: ./application/backend
      dockerfile: Dockerfile
      target: production
      args:
        SERVICE: carservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${CAR_POSTGRES_DB:-carservice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ISSUER: ${ISSUER}
      KEYCLOAK_INTERNAL_REALM_URI: ${KEYCLOAK_INTERNAL_REALM_URI:-http://keycloak:8090/realms/rag}
      CAR_SERVICE_CLIENT_ID: ${CAR_SERVICE_CLIENT_ID:-carservice}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-true}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:29092
    expose:
      - "8080"
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3m
    networks:
      - edge
      - car-data

  notificationservice:
    image: rag-notificationservice:stage
    restart: always
    build:
      context: ./application/backend
      dockerfile: Dockerfile
      target: production
      args:
        SERVICE: notificationservice
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${NOTIFICATION_POSTGRES_DB:-notificationservice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: maildev
      SPRING_MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      maildev:
        condition: service_started
    networks:
      - edge
      - notification-data

  aiservice:
    image: rag-aiservice:stage
    restart: always
    build:
      context: ./application/backend
      dockerfile: Dockerfile
      target: production
      args:
        SERVICE: aiservice
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AI_POSTGRES_DB:-aiservice}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CARSERVICE_BASE_URL: http://carservice:8080
      ISSUER: ${ISSUER}
      KEYCLOAK_INTERNAL_REALM_URI: ${KEYCLOAK_INTERNAL_REALM_URI:-http://keycloak:8090/realms/rag}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:4566}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AI_SERVICE_CLIENT_ID: ${AI_SERVICE_CLIENT_ID:-aiservice}
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      carservice:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45m
    networks:
      - edge
      - ai-data

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ai-data
      - ollama-egress

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    command: pull bge-m3
    networks:
      - ai-data
      - ollama-egress

  keycloak-postgres:
    image: postgres:18.6-trixie
    restart: always
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - keycloak-postgres-seeded-data:/var/lib/postgresql
      - ./infrastructure/keycloak/db-init/keycloak-db.sql:/docker-entrypoint-initdb.d/keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    networks:
      - auth-data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    restart: always
    command: start
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_HEALTH_ENABLED: "true"
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      BASE_URL: ${BASE_URL}
      CLIENT_SECRET: ${CLIENT_SECRET}
    volumes:
      - ./infrastructure/keycloak/themes/rag:/opt/keycloak/themes/rag:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2m
    networks:
      - edge
      - auth-data

  maildev:
    image: maildev/maildev:2.2.1
    restart: always
    ports:
      - "1080:1080"
      - "1025:1025"
    environment:
      - TZ=Europe/Berlin
    networks:
      - edge

volumes:
  postgres-data:
  keycloak-postgres-seeded-data:
  ollama-data:
  rag-app-data:

secrets:
  better_auth_secret:
    environment: BETTER_AUTH_SECRET
  client_secret:
    environment: CLIENT_SECRET
  altcha_hmac_secret:
    environment: ALTCHA_HMAC_SECRET

networks:
  edge:
  ollama-egress:
  auth-data:
    internal: true
  car-data:
    internal: true
  ai-data:
    internal: true
  notification-data:
    internal: true
