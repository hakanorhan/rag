name: rag-prod

include:
  - ../compose-shared/compose.infrastructure.yml
  - rag-app/compose.prod.yml
  - backend/carservice/compose.prod.yml
  - backend/aiservice/compose.prod.yml

services:
  keycloak:
    extends:
      file: ../compose-shared/compose.keycloak.yml
      service: keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:
      BASE_URL: ${BASE_URL}
      CLIENT_SECRET: ${CLIENT_SECRET}
    volumes:
      - ../../../infrastructure/keycloak/prod:/opt/keycloak/data/import:ro
