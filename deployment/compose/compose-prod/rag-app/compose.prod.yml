services:
  app:
    extends:
      file: ../../compose-shared/rag-app/compose.base.yml
      service: app
    environment:
      DATABASE_PATH: /app/data/sqlite.db
    image: rag-app:prod
    build:
      context: ../../../../application/rag-app
      dockerfile: Dockerfile
      target: production
      args:
        BASE_URL: ${BASE_URL}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        CLIENT_ID: ${CLIENT_ID}
        ISSUER: ${ISSUER}
      secrets:
        - better_auth_secret
        - client_secret
    volumes:
      - rag-app-data:/app/data

volumes:
  rag-app-data:

secrets:
  better_auth_secret:
    environment: BETTER_AUTH_SECRET
  client_secret:
    environment: CLIENT_SECRET
