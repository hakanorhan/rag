services:
  carservice:
    extends:
      file: ../../../compose-shared/backend/carservice/compose.base.yml
      service: carservice
    image: rag-carservice:dev
    build:
      context: ../../../../../application/backend
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE: carservice
    volumes:
      - maven-cache:/root/.m2
    develop:
      watch:
        - action: sync+exec
          path: ../../../../../application/backend/carservice/src
          target: /app/carservice/src
          initial_sync: true
          exec:
            command: mvn --batch-mode --no-transfer-progress -DskipTests compile
        - action: rebuild
          path: ../../../../../application/backend/carservice/pom.xml
        - action: rebuild
          path: ../../../../../application/backend/Dockerfile
        - action: rebuild
          path: ../../../../../application/backend/commonlib
        - action: rebuild
          path: ../../../../../application/backend/service-parent/pom.xml
        - action: rebuild
          path: ../../../../../application/backend/pom.xml

volumes:
  maven-cache:
