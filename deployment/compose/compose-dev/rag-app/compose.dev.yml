services:
  app:
    extends:
      file: ../../compose-shared/rag-app/compose.base.yml
      service: app
    image: rag-app:dev
    build:
      context: ../../../../application/rag-app
      dockerfile: Dockerfile
      target: development
    volumes:
      - ../../../../application/rag-app:/app
      - rag-app-node-modules:/app/node_modules
      - rag-app-next-cache:/app/.next

volumes:
  rag-app-node-modules:
  rag-app-next-cache:
