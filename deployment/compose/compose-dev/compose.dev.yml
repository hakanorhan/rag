name: rag-dev

include:
  - ../compose-shared/compose.infrastructure.yml
  - rag-app/compose.dev.yml
  - backend/carservice/compose.dev.yml
  - backend/aiservice/compose.dev.yml

services:
  keycloak:
    extends:
      file: ../compose-shared/compose.keycloak.yml
      service: keycloak
    command: start-dev

  keycloak-postgres:
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
      - ../../../infrastructure/keycloak/db-init/keycloak-db.sql:/docker-entrypoint-initdb.d/keycloak-db.sql:ro

  adminer:
    image: adminer:5.4.2-standalone
    restart: always
    ports:
      - "${DEVTOOLS_BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:-5499}:8080"
    networks:
      - edge
      - auth-data
      - car-data
      - ai-data

  maildev:
    image: maildev/maildev:2.2.1
    container_name: maildev
    restart: always
    ports:
      - "1080:1080"
      - "1025:1025"
    environment:
      - TZ=Europe/Berlin
    networks:
      - edge
