services:
  carservice:
    image: rag-carservice:dev
    build:
      context: ..
      dockerfile: carservice/Dockerfile.dev
    volumes:
      - carservice-maven-cache:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ISSUER: ${ISSUER}
      KEYCLOAK_INTERNAL_REALM_URI: ${KEYCLOAK_INTERNAL_REALM_URI:-http://keycloak:8090/realms/rag}
      CAR_SERVICE_CLIENT_ID: ${CAR_SERVICE_CLIENT_ID:-carservice}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3m
    networks:
      - edge
      - car-data
    develop:
      watch:
        - action: sync+exec
          path: src
          target: /app/carservice/src
          initial_sync: true
          exec:
            command: mvn --batch-mode --no-transfer-progress -DskipTests compile
        - action: rebuild
          path: pom.xml
        - action: rebuild
          path: Dockerfile.dev
        - action: rebuild
          path: ../commonlib
        - action: rebuild
          path: ../service-parent/pom.xml
        - action: rebuild
          path: ../pom.xml

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1m
    networks:
      - car-data

volumes:
  carservice-maven-cache:
  postgres-data:
