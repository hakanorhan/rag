services:
  carservice:
    extends:
      file: compose.base.yml
      service: carservice
    image: rag-carservice:dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE: carservice
    volumes:
      - maven-cache:/root/.m2
    develop:
      watch:
        - action: sync+exec
          path: src
          target: /app/carservice/src
          initial_sync: true
          exec:
            command: mvn --batch-mode --no-transfer-progress -DskipTests compile
        - action: rebuild
          path: pom.xml
        - action: rebuild
          path: ../Dockerfile
        - action: rebuild
          path: ../commonlib
        - action: rebuild
          path: ../service-parent/pom.xml
        - action: rebuild
          path: ../pom.xml

volumes:
  maven-cache:
