services:
  aiservice:
    extends:
      file: compose.base.yml
      service: aiservice
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:4566}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    image: rag-aiservice:dev
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
      args:
        SERVICE: aiservice
    volumes:
      - maven-cache:/root/.m2
    develop:
      watch:
        - action: sync+exec
          path: src
          target: /app/aiservice/src
          initial_sync: true
          exec:
            command: mvn --batch-mode --no-transfer-progress -DskipTests compile
        - action: rebuild
          path: pom.xml
        - action: rebuild
          path: ../Dockerfile
        - action: rebuild
          path: ../commonlib
        - action: rebuild
          path: ../service-parent/pom.xml
        - action: rebuild
          path: ../pom.xml

volumes:
  maven-cache:
