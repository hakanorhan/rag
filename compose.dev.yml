name: rag-dev

include:
  - rag-app/compose.dev.yml
  - carservice/compose.dev.yml
  - aiservice/compose.dev.yml

services:
  nginx:
    image: nginx:1.30.4-trixie
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      edge:
        aliases:
          - auth.localhost

  keycloak-postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m
    networks:
      - auth-data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_HEALTH_ENABLED: "true"
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ./infrastructure/keycloak/import-realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2m
    networks:
      - edge
      - auth-data

  adminer:
    image: adminer:5.4.2-standalone
    ports:
      - "${DEVTOOLS_BIND_ADDRESS:-127.0.0.1}:${ADMINER_PORT:-5499}:8080"
    networks:
      - edge
      - auth-data
      - car-data
      - ai-data

volumes:
  keycloak-postgres-data:

networks:
  edge:
  auth-data:
    internal: true
  car-data:
    internal: true
  ai-data:
    internal: true
